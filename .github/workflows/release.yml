name: Publish Production App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Defaults to v1.0.<run_number> if omitted.'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release title (e.g. Ludo Supreme v1.0.0)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Keystore from GitHub Secrets
        run: |
          python3 -c '
          import base64, os, sys
          b64 = os.environ.get("KEYSTORE_BASE64", "").strip()
          if not b64:
              sys.exit("::error::KEYSTORE_BASE64 secret is missing! Please configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in your GitHub repository secrets.")
          # Strip any accidental wrapping quotes
          if (b64.startswith("\"") and b64.endswith("\"")) or (b64.startswith("\x27") and b64.endswith("\x27")):
              b64 = b64[1:-1].strip()
          if b64.startswith("base64 ") or "release.keystore" in b64:
              sys.exit("::error::It looks like you pasted the command \"base64 -w 0 app/release.keystore\" into KEYSTORE_BASE64 instead of its output text! Please copy the generated base64 string.")
          try:
              decoded = base64.b64decode(b64)
              os.makedirs("app", exist_ok=True)
              with open("app/release.keystore", "wb") as f:
                  f.write(decoded)
              print(f"Keystore successfully configured ({len(decoded)} bytes)")
          except Exception as e:
              sys.exit(f"::error::Failed to decode KEYSTORE_BASE64: {e}. Please ensure the entire base64 string was copied.")
          '
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Production APK & AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/com.100xadi.ludo.apk
          cp app/build/outputs/bundle/release/app-release.aab release-artifacts/com.100xadi.ludo.aab

          # Determine tag name
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi

          # Determine release title
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            TITLE="${{ github.event.inputs.release_name }}"
          else
            TITLE="Ludo Supreme $TAG"
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ludo-production-builds
          path: release-artifacts/*
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.release_tag }}
          name: ${{ steps.prepare_artifacts.outputs.release_title }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/com.100xadi.ludo.apk
            release-artifacts/com.100xadi.ludo.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
